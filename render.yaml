services:
  - type: web
    name: kct-ai-smart-library
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: BORROWING_MODE
        value: testing
      - key: MONGODB_URI
        sync: false
      - key: DB_NAME
        value: smart_library
      - key: JWT_SECRET
        generateValue: true

